# The iPhone "does it open" walk (iPhone plan, stage 3). Maestro taps the real app on the simulator
# by the words a person sees, and takes a picture at each step. Any crash, or any step whose words do
# not appear, fails the run.
appId: com.vastufirst.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "I am building a home"
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "I am building a home"
- extendedWaitUntil:
    visible: "Add your home"
    timeout: 20000
- takeScreenshot: 02-add-home

# Upload a plan: the privacy card first, then the iPhone asks where the plan is (Photos or Files).
# Cancelling that first pick goes back to "Add your home" - no paid read ever happens in this walk.
- tapOn: "Upload a plan"
- extendedWaitUntil:
    visible: "Your plan leaves this phone"
    timeout: 20000
- takeScreenshot: 03-consent
- scrollUntilVisible:
    element: "I agree — read my plan"
- tapOn: "I agree — read my plan"
- extendedWaitUntil:
    visible: "Where is your plan.*"
    timeout: 20000
- takeScreenshot: 04-where-is-your-plan
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Add your home"
    timeout: 20000

# Draw by hand: the grid editor.
- scrollUntilVisible:
    element: "Draw it on a grid"
- tapOn: "Draw it on a grid"
- extendedWaitUntil:
    visible: "Place your rooms"
    timeout: 20000
- takeScreenshot: 05-editor

# The new ‹ arrow (no Back key on an iPhone) leaves the editor.
- tapOn:
    text: "Back"
    index: 0
- extendedWaitUntil:
    visible: "Add your home"
    timeout: 20000

# The sample home all the way to its report. Since 15 Oct 2026 the sample is the bundled sample SHEET:
# it opens on the scan result ("We read 8 rooms") with North asked on the sheet's own photograph.
- scrollUntilVisible:
    element: "Try a sample plan"
- tapOn: "Try a sample plan"
- extendedWaitUntil:
    visible: "We read .* rooms"
    timeout: 20000
- takeScreenshot: 06-sample-result
# Swipe from the bottom edge: a swipe through the middle lands on the North dial, which turns instead
# of scrolling (the dial is meant to be dragged).
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 93%
          end: 50%, 45%
- tapOn: ".*[Rr]ead my home"
- extendedWaitUntil:
    visible: "(?i).*full report.*"
    timeout: 30000
- takeScreenshot: 07-report

# Unlock (free in this version: the screen says no payment is taken), then share the full report as a
# PDF. The iPhone's own share sheet must open - proof the PDF was written.
- tapOn: "Unlock the full report"
- extendedWaitUntil:
    visible: ".*not charged in this version.*"
    timeout: 20000
- takeScreenshot: 08-unlock
- tapOn: "Unlock on this device — free"
- extendedWaitUntil:
    visible: "(?i).*full report.*"
    timeout: 20000
- scrollUntilVisible:
    element: "Share this report as a PDF"
    direction: DOWN
    timeout: 60000
- tapOn: "Share this report as a PDF"
- extendedWaitUntil:
    visible: "(?i).*(save to files|copy|print|mail|messages).*"
    timeout: 20000
- takeScreenshot: 09-share-sheet
