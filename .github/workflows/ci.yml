name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The render gate commits freshly-recorded goldens back to the branch (UI-POLISH §6.3), so the
    # job needs write access. Everything else here is read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 20 (design-fidelity gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Guardrails first: fail fast before compiling ---
      - name: Module-boundary check (engine/rules/shared/data are Android-free)
        run: bash scripts/check-boundaries.sh

      - name: Token check (no raw hex / dp / sp outside the theme package)
        run: bash scripts/check-tokens.sh

      # UI-POLISH.md gates. These exist because CI used to compile the UI without ever looking
      # at it — see docs/UI-AUDIT-2026-07-24.md for what that let through.
      - name: Window-inset check (every screen root clears the system bars)
        run: bash scripts/check-screen-roots.sh

      - name: Design-fidelity check (theme matches handoff/tokens.json + the design type ramp)
        run: node scripts/check-design-fidelity.mjs .

      # The behavioural fuzz harness. Suites A–D mirror the guided-grid editor (they found the stale
      # plot-size coordinate bug, the 1×1 grip swallowing a room's centre, and the door left off the
      # footprint after a plot resize); Suite E mirrors the scan mapper and asserts that everything it
      # emits is a plan the editor could legally hold.
      # ⚠ Until now these only ran when I remembered to run them — four suites that have each caught a
      # real bug, gating nothing. 20 s of CI is a cheap price for that not being true any more.
      - name: Behavioural fuzz (editor gestures · WCAG button paths · scan mapper)
        run: node tools/grid-prototype/sim.mjs 2000

      # --- Compile + test ---
      - name: Unit tests (pure logic modules)
        run: gradle :shared:test :rules:test :engine:test :data:test --stacktrace

      # "BUILD SUCCESSFUL" also prints when a test class quietly stopped being picked up, so print
      # what actually ran. Claims like "55 tests cover the scan mapper" should be checkable from the
      # CI log rather than taken on trust (CLAUDE.md §3: show the real result).
      - name: Test summary (what actually ran)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fails = skips = 0
          rows = []
          for f in sorted(glob.glob('*/build/test-results/**/*.xml', recursive=True)):
              s = ET.parse(f).getroot()
              t, fl, er, sk = (int(s.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += t; fails += fl + er; skips += sk
              rows.append((s.get('name', '?'), t, fl + er, sk))
          for name, t, fl, sk in rows:
              print(f"  {t:4d} tests  {fl:2d} failed  {sk:2d} skipped   {name}")
          print(f"TOTAL: {total} tests, {fails} failed, {skips} skipped")
          PY

      # --- Gate 3: the build renders every screen (UI-POLISH.md §6) ---
      # This is the gate that would have caught the zero-height grid, the inset overlap and the
      # shattered rows. It runs AFTER the fast guardrails above, so those still fail-fast.
      #
      # Now-in-Android bootstrap (§6.3), made robust:
      #   - No goldens committed yet → RECORD and commit (first time this screen is drawn).
      #   - Goldens present          → VERIFY; on a mismatch (a deliberate screen change) re-record
      #     with --rerun-tasks (so Gradle can't serve a cached test task) and commit. The image diff
      #     in that commit IS the visual change to review.
      # `[skip ci]` on the golden commit avoids a redundant re-run — the goldens were just rendered
      # from this exact commit, so they are correct by construction.
      - name: Are goldens committed yet?
        id: golden_state
        run: |
          if [ -n "$(find app/src/androidUnitTest/roborazzi -name '*.png' 2>/dev/null | head -1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render screens — verify goldens
        id: verify_render
        if: steps.golden_state.outputs.present == 'true'
        continue-on-error: true
        run: gradle :app:verifyRoborazziDebug --stacktrace

      - name: Render screens — record goldens (bootstrap / deliberate change)
        id: record_render
        if: >-
          github.event_name == 'push' &&
          (steps.golden_state.outputs.present == 'false' || steps.verify_render.outcome == 'failure')
        continue-on-error: true
        # Explicit record property on the test task (the convenience task recordRoborazziDebug ran
        # but produced no images). --rerun-tasks so the test can't be served from cache.
        run: gradle :app:testDebugUnitTest -Proborazzi.test.record=true --rerun-tasks --stacktrace

      # Diagnostics: a genuine render failure (record could not produce goldens). The console
      # truncates the stack, so dump the full test-results XML, then re-fail the job (record was
      # continue-on-error so we could reach this). A successful bootstrap record does NOT come here.
      - name: Show render test stack traces (record failed)
        if: steps.record_render.outcome == 'failure'
        run: |
          shopt -s nullglob
          found=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            found=1
            echo "=================== $f ==================="
            cat "$f"
          done
          [ "$found" = 0 ] && echo "No test-results XML found."
          exit 1

      # Fail the job if verify failed on a PR (no auto-record path there) — a PR must not merge a
      # screen the harness could not verify. On push we record below, so this passes.
      - name: Enforce render verify on pull requests
        if: steps.verify_render.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::Screen render verification failed. Pull the CI-committed goldens, or fix the screen."
          exit 1

      # L1 geometry gate — MUST run BEFORE the commit, because it adopts new screens / tightens
      # counts into render-baseline.json, and that updated file is part of what the commit persists.
      # Reads the measurement manifests the render test just wrote; ratchet (fails only on a NEW
      # finding); fail-loud if no manifest was produced.
      - name: L1 render-manifest check (measured geometry)
        run: node scripts/check-render-manifest.mjs .

      # Gate 3c: accessibility (UI-POLISH §6.6). Google's ATF (contrast / touch target / labels /
      # traversal) ran headless inside the same JVM render (AccessibilityTest). Ratchet like L1:
      # adopt new screens, fail only on a NEW finding; fail-loud (exit 2) if the check itself broke.
      - name: A11y check (ATF contrast / labels / traversal)
        run: node scripts/check-a11y-manifest.mjs .

      # Runs on any push (implicit success() — a gate regression fails the job first and skips this).
      # The porcelain check no-ops when nothing changed, so this also persists a baseline the gate
      # adopted on a verify-pass run where no record happened.
      - name: Commit new / updated goldens back
        if: github.event_name == 'push'
        run: |
          set -e
          # Goldens AND the ratchet baselines (the gates above adopt new screens / tighten counts).
          git add app/src/androidUnitTest/roborazzi app/src/androidUnitTest/render-baseline.json app/src/androidUnitTest/a11y-baseline.json
          # --porcelain sees UNTRACKED files too (git diff would miss brand-new goldens).
          if [ -z "$(git status --porcelain -- app/src/androidUnitTest/roborazzi app/src/androidUnitTest/render-baseline.json app/src/androidUnitTest/a11y-baseline.json)" ]; then
            echo "No golden or baseline changes to commit."
            exit 0
          fi
          git config user.name "VastuFirst CI"
          git config user.email "simpleapps108@gmail.com"
          git commit -m "ci: record screen render goldens [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vastufirst-screenshots
          # Goldens + any verify diffs (build/outputs/roborazzi holds *_compare.png on a mismatch)
          # + the L1 measurement manifests (build/render-manifest).
          path: |
            app/src/androidUnitTest/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/render-manifest/**
            app/build/a11y-manifest/**
          if-no-files-found: warn

      - name: Build Android app (empty VastuTheme screen)
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vastufirst-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
