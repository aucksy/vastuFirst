name: Release

# Tag-driven build: push a v* tag → build the app → publish a GitHub Release with the APK
# attached, so there is a direct .apk download link per phase. Phase 2 ships a DEBUG-signed
# APK (installable for client testing); a release-signed AAB/APK arrives with the store setup.
#
# ⭐ TWO WAYS IN, ONE PATH THROUGH (8 Sep 2026). A remote Claude session can push commits to its
# branch but its connection refuses every tag ("only branch updates are permitted"), so a session
# that had built, tested and written up a release could not cut it — v0.23.0 sat finished on a
# branch with no way to tag it. The manual trigger now takes the version as an input: the runner,
# which has no such restriction, creates the tag itself on the commit it checked out and pushes it
# ONLY after every gate below has passed, then publishes exactly as a tag push would. Started by
# hand with no version, it runs the gates and publishes nothing, as before.
#
# A tag pushed by the runner with its own token does not start another run of this workflow (GitHub
# never fires workflows for GITHUB_TOKEN pushes), so there is no second release and no recursion.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.23.0 — created on the chosen branch's latest commit once every gate passes. Leave empty to run the gates only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # ⭐ Without this secret the released APK cannot read plans — it will say so on screen rather
      # than fail quietly, but the feature the release is FOR would be missing. Set it at
      # Settings → Secrets and variables → Actions → OPENROUTER_API_KEY.
      # (OpenRouter since 4 Aug 2026 — the reader head-to-head, plan doc §3p.)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # ⭐ The Play Store signing key, in the only form a GitHub secret can hold: base64 text.
      # Lifted to the job env so the decode step can ASK WHETHER IT EXISTS — the `secrets` context is
      # not readable from a step `if:`, and without that test a repo with no key set would fail every
      # release instead of quietly falling back to the committed test key.
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⭐ Tags and history, because the client-log guard below reads the DATE of the tag being
          # released. A shallow checkout hands it a tag with no commit behind it, and the guard is
          # built to exit 2 rather than pass in that case — so this is what keeps it able to run.
          fetch-depth: 0

      # ⭐ Which version this run releases, decided once and read by every later step as RELEASE_TAG.
      #   · a tag push          → the tag that was pushed, exactly as before
      #   · manual, with a tag  → that tag, created HERE on the checked-out commit (annotated, in the
      #                           CI's own name) but NOT pushed yet — the push waits until every gate
      #                           has passed, so a failed run never leaves a tag behind with no build
      #   · manual, no tag      → empty: gates only, nothing published
      # A name that already exists on some OTHER commit is refused outright rather than moved.
      - name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG=""
          PUSH_TAG="false"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$TAG' is not a version tag (expected the form v0.23.0)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
              git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
              if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::$TAG already exists on a different commit. A tag is never moved; pick the next version."
                exit 1
              fi
              echo "$TAG already exists on this exact commit — reusing it (a re-run)."
            else
              git config user.name "VastuFirst CI"
              git config user.email "simpleapps108@gmail.com"
              git tag -a "$TAG" -m "VastuFirst $TAG — released by hand from $GITHUB_REF_NAME at $(git rev-parse --short HEAD)"
              PUSH_TAG="true"
              echo "Created $TAG locally on $(git rev-parse --short HEAD); it is pushed only once every gate has passed."
            fi
          else
            echo "Manual run with no version: running the gates only, publishing nothing."
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PUSH_TAG=$PUSH_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 20 (design-fidelity gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guardrails + tests must pass before we publish anything. A release clears the SAME UI
      # gates as CI — otherwise tagging becomes a way to ship unverified UI (docs/UI-POLISH.md).
      # ⭐⭐ FIRST, and before anything is built (CLAUDE.md §2d). A release whose build is written up
      # nowhere the client can read is not finished, and finding that out after a ten-minute build
      # is finding it out too late to fix in the same commit — which is the whole of the rule.
      # The tag is passed in rather than discovered: it is the subject of the check.
      #
      # ⚠ …and it is asked about RELEASE_TAG, never about `ref_name` blindly: on a manual run
      # `ref_name` is the BRANCH, and that once asked the guard whether the client log mentions a
      # build called "main", which it never will. A manual run WITH a version asks about that
      # version (created just above, so its date is readable); one without passes an empty argument
      # and the guard finds the newest tag itself, which is the right question for a gates-only run.
      - name: Client-log check (this release must be written up for the client)
        run: bash scripts/check-client-log.sh "${{ env.RELEASE_TAG }}"

      - name: Module-boundary check
        run: bash scripts/check-boundaries.sh
      - name: Token check
        run: bash scripts/check-tokens.sh
      - name: Manifest check (the plan reader needs the network; nothing else needs a permission)
        run: bash scripts/check-manifest.sh
      - name: Window-inset check (every screen root clears the system bars)
        run: bash scripts/check-screen-roots.sh

      # ⭐ A release must not publish an APK whose reading key is rejected — that is the whole feature
      # silently missing, discovered by the client rather than by us.
      - name: Plan-reader key check (the key works, the model still exists)
        run: python3 scripts/check-plan-reader-key.py
      - name: Design-fidelity check (theme matches the design contract)
        run: node scripts/check-design-fidelity.mjs .
      - name: Unit tests (pure logic modules)
        run: gradle :shared:test :rules:test :engine:test :data:test --stacktrace

      # Render gate (UI-POLISH §6): a release must VERIFY every screen against its committed golden
      # and pass the L1 geometry check. Verify only (never record) — tagging must not silently
      # re-baseline a screen. If a screen changed without its goldens being updated on main first,
      # the release fails, which is the point.
      - name: Render screens — verify goldens
        run: gradle :app:verifyRoborazziDebug --stacktrace
      - name: L1 render-manifest check (measured geometry)
        run: node scripts/check-render-manifest.mjs .
      - name: A11y check (ATF contrast / labels / traversal)
        run: node scripts/check-a11y-manifest.mjs .

      - name: Upload rendered screenshots
        # ⚠ Non-fatal (4 Aug 2026): a full artifact storage quota killed the v0.7.0 release AFTER
        # every gate had passed and BEFORE the release was published — the one step order made
        # worse by a red herring. The goldens live in the repo; this artifact is a convenience.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vastufirst-screenshots
          path: |
            app/src/androidUnitTest/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/render-manifest/**
            app/build/a11y-manifest/**
          if-no-files-found: warn
          # Longer than CI's 7 days: this is the evidence the release review gate is walked against,
          # so it must still be there a fortnight after the tag. Still bounded — the 90-day default
          # is what quietly refills the shared 500 MB store across the account.
          retention-days: 14

      - name: Build Android app
        run: gradle :app:assembleDebug --stacktrace

      # ⭐ THE STORE KEY, DECODED. A keystore is a binary file and a GitHub secret only holds text,
      # so it is stored base64-encoded and turned back into a file here — into the runner's temp
      # directory, never into the checkout, so it cannot be picked up by a later `git add`.
      #
      # ⚠ Deliberately CONDITIONAL and silent when absent: with no key set the release still builds
      # and publishes, signed by the committed test key, exactly as it does today. Making this step
      # mandatory would break every release until the owner's Play account exists.
      #
      # The path must be ABSOLUTE — Gradle resolves `file(...)` against the app module, not the repo
      # root, so a relative path would silently point at the wrong place.
      - name: Decode the release signing key (only when one has been supplied)
        if: env.RELEASE_STORE_FILE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/vastufirst-release.jks"
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | base64 --decode > "$KEYSTORE"
          # A truncated or mis-pasted secret decodes to garbage that only fails much later, at
          # signing, with an unhelpful message. Prove the keystore opens before anything depends on it.
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" > /dev/null
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Release signing key decoded and verified."

      - name: Say which key this release is signed with
        run: |
          if [ -n "${RELEASE_STORE_FILE:-}" ]; then
            echo "Signed with the owner's Play Store key."
          else
            echo "No store key supplied — signed with the committed test key (installable, not publishable)."
          fi

      # The shrunk build a store upload would be made from. Built on every release so the shrinker
      # can never be met for the first time on the day it matters.
      - name: Build the shrunk release
        run: gradle :app:assembleRelease --stacktrace

      # ⭐ A release is exactly where this matters: a published APK signed by a new key costs every
      # tester their saved homes, and they find out by hitting "App not installed".
      - name: Signature check (the release must install over the previous one)
        run: python3 scripts/check-apk-signature.py "app/build/outputs/apk/debug/*.apk"

      - name: Name the APK for the release
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/vastufirst-${RELEASE_TAG}.apk"

      # The decoded key must not outlive the job even if a step above failed.
      - name: Shred the decoded signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/vastufirst-release.jks"

      # Only now, with every gate green and the APK built, does a hand-started release get its tag
      # on GitHub. Pushed with the runner's own token, so it starts no second run of this workflow.
      - name: Push the release tag (manual runs only)
        if: env.PUSH_TAG == 'true'
        run: git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.apk
          generate_release_notes: true
          name: "VastuFirst ${{ env.RELEASE_TAG }}"
          body: |
            VastuFirst Android — ${{ env.RELEASE_TAG }}.
            Test APK, installs on any Android 8.0+ device.

            From v0.3.17 onward every build is signed with the same key, so this installs straight
            over the previous version and your saved homes are kept. Coming from v0.3.16 or earlier
            you have to uninstall once — those builds were each signed with a throwaway key.

            Drawing, scoring and your saved homes all work offline. Reading an uploaded plan is the
            one feature that needs the internet, and it asks first.
