name: Release

# Tag-driven build: push a v* tag → build the app → publish a GitHub Release with the APK
# attached, so there is a direct .apk download link per phase. Phase 2 ships a DEBUG-signed
# APK (installable for client testing); a release-signed AAB/APK arrives with the store setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # ⭐ Without this secret the released APK cannot read plans — it will say so on screen rather
      # than fail quietly, but the feature the release is FOR would be missing. Set it at
      # Settings → Secrets and variables → Actions → OPENROUTER_API_KEY.
      # (OpenRouter since 4 Aug 2026 — the reader head-to-head, plan doc §3p.)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # ⭐ The Play Store signing key, in the only form a GitHub secret can hold: base64 text.
      # Lifted to the job env so the decode step can ASK WHETHER IT EXISTS — the `secrets` context is
      # not readable from a step `if:`, and without that test a repo with no key set would fail every
      # release instead of quietly falling back to the committed test key.
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 20 (design-fidelity gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guardrails + tests must pass before we publish anything. A release clears the SAME UI
      # gates as CI — otherwise tagging becomes a way to ship unverified UI (docs/UI-POLISH.md).
      - name: Module-boundary check
        run: bash scripts/check-boundaries.sh
      - name: Token check
        run: bash scripts/check-tokens.sh
      - name: Manifest check (the plan reader needs the network; nothing else needs a permission)
        run: bash scripts/check-manifest.sh
      - name: Window-inset check (every screen root clears the system bars)
        run: bash scripts/check-screen-roots.sh

      # ⭐ A release must not publish an APK whose reading key is rejected — that is the whole feature
      # silently missing, discovered by the client rather than by us.
      - name: Plan-reader key check (the key works, the model still exists)
        run: python3 scripts/check-plan-reader-key.py
      - name: Design-fidelity check (theme matches the design contract)
        run: node scripts/check-design-fidelity.mjs .
      - name: Unit tests (pure logic modules)
        run: gradle :shared:test :rules:test :engine:test :data:test --stacktrace

      # Render gate (UI-POLISH §6): a release must VERIFY every screen against its committed golden
      # and pass the L1 geometry check. Verify only (never record) — tagging must not silently
      # re-baseline a screen. If a screen changed without its goldens being updated on main first,
      # the release fails, which is the point.
      - name: Render screens — verify goldens
        run: gradle :app:verifyRoborazziDebug --stacktrace
      - name: L1 render-manifest check (measured geometry)
        run: node scripts/check-render-manifest.mjs .
      - name: A11y check (ATF contrast / labels / traversal)
        run: node scripts/check-a11y-manifest.mjs .

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vastufirst-screenshots
          path: |
            app/src/androidUnitTest/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/render-manifest/**
            app/build/a11y-manifest/**
          if-no-files-found: warn

      - name: Build Android app
        run: gradle :app:assembleDebug --stacktrace

      # ⭐ THE STORE KEY, DECODED. A keystore is a binary file and a GitHub secret only holds text,
      # so it is stored base64-encoded and turned back into a file here — into the runner's temp
      # directory, never into the checkout, so it cannot be picked up by a later `git add`.
      #
      # ⚠ Deliberately CONDITIONAL and silent when absent: with no key set the release still builds
      # and publishes, signed by the committed test key, exactly as it does today. Making this step
      # mandatory would break every release until the owner's Play account exists.
      #
      # The path must be ABSOLUTE — Gradle resolves `file(...)` against the app module, not the repo
      # root, so a relative path would silently point at the wrong place.
      - name: Decode the release signing key (only when one has been supplied)
        if: env.RELEASE_STORE_FILE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/vastufirst-release.jks"
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | base64 --decode > "$KEYSTORE"
          # A truncated or mis-pasted secret decodes to garbage that only fails much later, at
          # signing, with an unhelpful message. Prove the keystore opens before anything depends on it.
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" > /dev/null
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Release signing key decoded and verified."

      - name: Say which key this release is signed with
        run: |
          if [ -n "${RELEASE_STORE_FILE:-}" ]; then
            echo "Signed with the owner's Play Store key."
          else
            echo "No store key supplied — signed with the committed test key (installable, not publishable)."
          fi

      # The shrunk build a store upload would be made from. Built on every release so the shrinker
      # can never be met for the first time on the day it matters.
      - name: Build the shrunk release
        run: gradle :app:assembleRelease --stacktrace

      # ⭐ A release is exactly where this matters: a published APK signed by a new key costs every
      # tester their saved homes, and they find out by hitting "App not installed".
      - name: Signature check (the release must install over the previous one)
        run: python3 scripts/check-apk-signature.py "app/build/outputs/apk/debug/*.apk"

      - name: Name the APK for the release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/vastufirst-${GITHUB_REF_NAME}.apk"

      # The decoded key must not outlive the job even if a step above failed.
      - name: Shred the decoded signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/vastufirst-release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          name: "VastuFirst ${{ github.ref_name }}"
          body: |
            VastuFirst Android — ${{ github.ref_name }}.
            Test APK, installs on any Android 8.0+ device.

            From v0.3.17 onward every build is signed with the same key, so this installs straight
            over the previous version and your saved homes are kept. Coming from v0.3.16 or earlier
            you have to uninstall once — those builds were each signed with a throwaway key.

            Drawing, scoring and your saved homes all work offline. Reading an uploaded plan is the
            one feature that needs the internet, and it asks first.
