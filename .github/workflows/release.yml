name: Release

# Tag-driven build: push a v* tag → build the app → publish a GitHub Release with the APK
# attached, so there is a direct .apk download link per phase. Phase 2 ships a DEBUG-signed
# APK (installable for client testing); a release-signed AAB/APK arrives with the store setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 20 (design-fidelity gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guardrails + tests must pass before we publish anything. A release clears the SAME UI
      # gates as CI — otherwise tagging becomes a way to ship unverified UI (docs/UI-POLISH.md).
      - name: Module-boundary check
        run: bash scripts/check-boundaries.sh
      - name: Token check
        run: bash scripts/check-tokens.sh
      - name: Window-inset check (every screen root clears the system bars)
        run: bash scripts/check-screen-roots.sh
      - name: Design-fidelity check (theme matches the design contract)
        run: node scripts/check-design-fidelity.mjs .
      - name: Unit tests (pure logic modules)
        run: gradle :shared:test :rules:test :engine:test :data:test --stacktrace

      # Render gate (UI-POLISH §6): a release must VERIFY every screen against its committed golden
      # and pass the L1 geometry check. Verify only (never record) — tagging must not silently
      # re-baseline a screen. If a screen changed without its goldens being updated on main first,
      # the release fails, which is the point.
      - name: Render screens — verify goldens
        run: gradle :app:verifyRoborazziDebug --stacktrace
      - name: L1 render-manifest check (measured geometry)
        run: node scripts/check-render-manifest.mjs .
      - name: A11y check (ATF contrast / labels / traversal)
        run: node scripts/check-a11y-manifest.mjs .

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vastufirst-screenshots
          path: |
            app/src/androidUnitTest/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/render-manifest/**
            app/build/a11y-manifest/**
          if-no-files-found: warn

      - name: Build Android app
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK for the release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/vastufirst-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          name: "VastuFirst ${{ github.ref_name }}"
          body: |
            VastuFirst Android — ${{ github.ref_name }}.
            Debug-signed APK for testing (installs on any Android 8.0+ device). Fully offline.
