# The iPhone eyes, part 1 (iPhone plan, stage 1): the engine, rules, plan-reader logic and saved-homes
# code, compiled for the iPhone and run on the iPhone simulator on a cloud Mac.
#
# ⭐ What this proves: the same test files the JVM runs (src/test/kotlin = common tests) pass on an
# iPhone — the sample home scores 31, the recorded plan readings map to the same rooms (Kotlin/Native
# has its own regex engine), and a REAL signed Control Room reply verifies with Apple's Security
# framework (a failure there is silent by design). Zero paid scans: recorded readings only.
#
# Mac minutes are free while the repository is public. It runs on every push to main that touches the
# pure modules or this file, and by hand. A hard time limit stops a stuck run from burning minutes.
name: iPhone engine

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'rules/**'
      - 'shared/**'
      - 'data/**'
      - 'app/**'
      - 'designsystem/**'
      - 'buildSrc/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-engine:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Which Xcode
        run: xcodebuild -version

      - name: Engine, rules, plan reader and saved homes on the iPhone simulator
        run: >
          gradle :shared:iosSimulatorArm64Test :rules:iosSimulatorArm64Test
          :engine:iosSimulatorArm64Test :data:iosSimulatorArm64Test --stacktrace

      # Stage 2: the shared screens (app commonMain) and the design kit compile for the iPhone.
      - name: The shared screens compile for the iPhone
        run: gradle :designsystem:compileKotlinIosSimulatorArm64 :app:compileKotlinIosSimulatorArm64 --stacktrace

      - name: What ran on the iPhone
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          total = fails = skips = 0
          for f in sorted(glob.glob('*/build/test-results/iosSimulatorArm64Test/*.xml')):
              s = ET.parse(f).getroot()
              t, fl, er, sk = (int(s.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += t; fails += fl + er; skips += sk
              print(f"  {t:4d} tests  {fl + er:2d} failed  {sk:2d} skipped   {s.get('name')}")
              for case in s.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"      FAILED: {case.get('name')}: {(bad.get('message') or '')[:300]}")
          print(f"IPHONE TOTAL: {total} tests, {fails} failed, {skips} skipped")

  # ⭐ THE iPHONE APP OPENS (iPhone plan, stage 3): build the real app for the simulator, start it, and
  # walk it by its visible words (Maestro), with a picture at each step. Fails on a crash or on any
  # step whose words never appear. No Apple account needed: simulator builds are unsigned.
  ios-app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Pick an iPhone simulator
        shell: python3 {0}
        run: |
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          phones = [d for runtime, devs in data["devices"].items() if "iOS" in runtime
                    for d in devs if d["name"].startswith("iPhone")]
          pick = sorted(phones, key=lambda d: d["name"])[-1]
          print("simulator:", pick["name"], pick["udid"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SIM_UDID=" + pick["udid"] + chr(10))
              f.write("SIM_NAME=" + pick["name"] + chr(10))

      - name: Build the iPhone app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/VastuFirst.xcodeproj -scheme VastuFirst -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath iosApp/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO GRADLE_BIN="$(which gradle)" build | tail -60

      - name: Install and open it
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" iosApp/build/Build/Products/Debug-iphonesimulator/VastuFirst.app
          xcrun simctl launch "$SIM_UDID" com.vastufirst.app
          sleep 15
          mkdir -p iphone-walk
          xcrun simctl io "$SIM_UDID" screenshot iphone-walk/00-opened.png
          # Still running 15 seconds later, or it crashed on open.
          xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q com.vastufirst.app

      - name: Walk the app (Maestro)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "$SIM_UDID" test iosApp/maestro/walk.yaml --test-output-dir iphone-walk

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-walk
          path: |
            iphone-walk/*.png
            iphone-walk/**/*.png
          retention-days: 14
