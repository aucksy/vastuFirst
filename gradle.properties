org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache stays OFF until the multi-module scaffold has a first green build.

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true


# iPhone targets (iPhone plan, stage 1) build only on a Mac; on the Linux runners they are skipped
# quietly instead of warning on every run.
kotlin.native.ignoreDisabledTargets=true
