# Version catalog — single source of truth for dependency versions (Impl PRD §2).
# Pin versions; do not float to "latest" without a reason.
[versions]
kotlin = "2.4.21"                 # iPhone plan stage 0b (14 Oct 2026). Apple takes only Xcode 26 builds, which Kotlin supports from 2.2.21
agp = "8.13.2"                    # Android 16 (compileSdk 36) needs AGP 8.9+. Stays < 9: AGP 9 forbids com.android.application in a KMP module (iPhone plan, stage 2)
composeMultiplatform = "1.11.1"  # newest line that builds on AGP 8.x; 1.12 needs AGP 9.1.1 (stage 2)
androidxActivityCompose = "1.9.3"
androidxCoreKtx = "1.13.1"
# The opening screen on Android 8-11, which have no system splash of their own. On 12+ it maps the
# same theme attributes onto the platform splash, so one theme describes the launch everywhere.
androidxCoreSplashscreen = "1.0.1"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.6.1"         # engine uses no java.time (Product PRD §3.1)
kotlinxCoroutines = "1.11.0"
koin = "4.1.1"                    # KMP-friendly DI. 4.1: koin-compose-viewmodel for screens shared with the iPhone (stage 2)
sqldelight = "2.4.1"             # KMP-native DB; 2.4 has the iPhone driver the plan uses (stage 1)
turbine = "1.2.0"
# ⭐ iPhone plan stage 2 (14 Oct 2026): navigation and lifecycle come from JetBrains' multiplatform
# builds, so the shared screens use them on both phones. Same package names as androidx; on Android
# they resolve to androidx itself (navigation 2.9.2 -> androidx 2.9.x, lifecycle 2.9.6 -> androidx 2.9.x).
jbNavigationCompose = "2.9.2"
jbLifecycle = "2.9.6"
# Google Play Billing — the ONLY payment route Play permits for digital content sold and read
# inside a Play Store app. Built in full, shipped behind a flag (app/.../billing/Billing.kt).
# ⚠ Play refuses new apps and updates on a Billing Library below 8 since 31 Aug 2026. 8.3.0 is the
# newest 8.x (built with Kotlin 2.2 - readable since the Kotlin 2.4 move; 8.0.0 was the only one Kotlin
# 2.0.21 could read). 9.x is a separate move with its own API changes. Nothing secret goes in the APK.
playBilling = "8.3.0"

# --- UI render harness (UI-POLISH.md §6). PINS ARE LOAD-BEARING — read docs/UI-POLISH.md §6.1
# before touching them. Until v0.37.0 Roborazzi was held at 1.60.0 under two ceilings: Gradle (1.62+
# is published by Gradle 9) and Kotlin metadata (1.61+ is compiled with Kotlin 2.3, unreadable by 2.0).
# Stage 0b lifts both: Kotlin 2.4, Gradle 9.5.1 + AGP 8.13.2 - the exact pairing Roborazzi 1.76.0's own
# build uses (its gradle/libs.versions.toml and wrapper at that tag).
# Robolectric 4.16 is the first that renders SDK 36 (our targetSdk), and it needs Java 21 to do it
# (CI installs 17 and 21; Gradle and the tests run on 21). Do NOT float these.
roborazzi = "1.76.0"
robolectric = "4.16.1"
# ui-test-manifest supplies the ComponentActivity that runComposeUiTest (the L1 semantics walk)
# launches under Robolectric. Pinned to the Jetpack Compose version that Compose Multiplatform 1.11.1
# maps to (1.11.2, read from its published module file) so it matches the compose-ui on the classpath.
androidxComposeUiTestManifest = "1.11.2"

# Android SDK levels: min 26 / target 36. Google Play refuses a target below 36 since 31 Aug 2026.
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }

# DI (declared now, wired in later phases).
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Navigation + lifecycle (Android UI — Phase 2, :app only).
jb-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jbNavigationCompose" }
jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jbLifecycle" }
jb-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jbLifecycle" }
play-billing = { module = "com.android.billingclient:billing-ktx", version.ref = "playBilling" }

# DB (declared now, wired in Phase 2).
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# JVM driver — TEST ONLY. Lets :data run its migrations against a real SQLite file rather than
# trusting that a migration which compiles is a migration that works.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Test.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# UI render harness (JVM screenshot tests — no emulator). See docs/UI-POLISH.md §6.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUiTestManifest" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
