# Version catalog — single source of truth for dependency versions (Impl PRD §2).
# Pin versions; do not float to "latest" without a reason.
[versions]
kotlin = "2.0.21"                 # K2 compiler (Impl PRD §2: Kotlin 2.0+)
agp = "8.7.3"                     # AGP 8.5+; 8.7 supports compileSdk 35 and is < 9 (no built-in-Kotlin trap)
composeMultiplatform = "1.7.1"   # Compose Multiplatform 1.6+
androidxActivityCompose = "1.9.3"
androidxCoreKtx = "1.13.1"
kotlinxSerialization = "1.7.3"
kotlinxDatetime = "0.6.1"         # engine uses no java.time (Product PRD §3.1)
kotlinxCoroutines = "1.9.0"
koin = "4.0.0"                    # KMP-friendly DI (Impl PRD §2) — applied from Phase 1
sqldelight = "2.0.2"             # KMP-native DB (Impl PRD §2) — applied from Phase 2
turbine = "1.2.0"

# Android SDK levels (Impl PRD §2): min 26 / target 35.
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }

# DI (declared now, wired in later phases).
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# DB (declared now, wired in Phase 2).
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }

# Test.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
